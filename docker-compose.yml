version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: quant_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models/saved:/app/models/saved
    environment:
      - ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quant_ai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
