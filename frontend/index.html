<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market Intelligence Dashboard</title>
    
    <!-- Tailwind CSS for Dark Mode Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>

    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darkBg text-slate-200 min-h-screen font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [predictions, setPredictions] = useState([]);
            const [isConnected, setIsConnected] = useState(false);
            const [ticker, setTicker] = useState("NVDA");
            const [headline, setHeadline] = useState("");
            const [loading, setLoading] = useState(false);
            const ws = useRef(null);

            // 1. Connect to WebSockets on Load
            useEffect(() => {
                connectWebSocket();
                return () => {
                    if (ws.current) ws.current.close();
                };
            }, []);

            const connectWebSocket = () => {
                ws.current = new WebSocket("ws://127.0.0.1:8000/ws");
                
                ws.current.onopen = () => setIsConnected(true);
                ws.current.onclose = () => {
                    setIsConnected(false);
                    // Reconnect after 3 seconds
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.current.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    // Add new prediction to the top of the list
                    setPredictions(prev => [data, ...prev]);
                    setLoading(false);
                };
            };

            // 2. Trigger AI Prediction
            const triggerPrediction = async (e) => {
                e.preventDefault();
                if (!headline) return;
                
                setLoading(true);
                
                try {
                    await fetch("http://127.0.0.1:8000/api/v1/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            ticker,
                            headline,
                            summary: headline
                        })
                    });
                    setHeadline("");
                } catch (err) {
                    console.error("Failed to trigger API", err);
                    setLoading(false);
                }
            };

            return (
                <div class="max-w-5xl mx-auto p-6">
                    {/* Header */}
                    <header class="flex justify-between items-center mb-10 pb-4 border-b border-slate-700">
                        <div>
                            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                                Quant AI Terminal
                            </h1>
                            <p class="text-slate-400 text-sm mt-1">Live XGBoost Sentiment Engine</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class={`w-3 h-3 rounded-full ${isConnected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`}></div>
                            <span class="text-sm font-medium text-slate-300">
                                {isConnected ? 'WS Connected' : 'Disconnected'}
                            </span>
                        </div>
                    </header>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {/* Left Column: Control Panel */}
                        <div class="col-span-1">
                            <div class="bg-cardBg p-6 rounded-xl border border-slate-700 shadow-xl">
                                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-white">
                                    <i data-lucide="zap"></i> Feed News
                                </h2>
                                <form onSubmit={triggerPrediction} class="flex flex-col gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Ticker</label>
                                        <input 
                                            type="text" 
                                            value={ticker}
                                            onChange={e => setTicker(e.target.value.toUpperCase())}
                                            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 font-mono"
                                            placeholder="NVDA"
                                        />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Headline / Rumor</label>
                                        <textarea 
                                            value={headline}
                                            onChange={e => setHeadline(e.target.value)}
                                            class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500 min-h-[100px]"
                                            placeholder="E.g., Nvidia announces massive chip delay..."
                                            required
                                        ></textarea>
                                    </div>
                                    <button 
                                        type="submit" 
                                        disabled={loading || !isConnected}
                                        class={`w-full font-bold rounded-lg p-3 transition-all ${
                                            loading 
                                            ? 'bg-slate-700 text-slate-400 cursor-not-allowed' 
                                            : 'bg-blue-600 hover:bg-blue-500 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)]'
                                        }`}
                                    >
                                        {loading ? 'Analyzing...' : 'Execute AI'}
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* Right Column: Live Feed */}
                        <div class="col-span-1 md:col-span-2">
                            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-white">
                                <i data-lucide="activity"></i> Live Signal Feed
                            </h2>
                            
                            <div class="flex flex-col gap-4">
                                {predictions.length === 0 && (
                                    <div class="bg-cardBg/50 border border-slate-800 border-dashed rounded-xl p-10 text-center text-slate-500">
                                        Waiting for AI signals...
                                    </div>
                                )}
                                
                                {predictions.map((pred, idx) => (
                                    <div key={idx} class="bg-cardBg p-5 rounded-xl border border-slate-700 shadow-lg transform transition-all hover:scale-[1.01] animate-[slideIn_0.3s_ease-out]">
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex items-center gap-3">
                                                <span class="bg-slate-900 text-blue-400 font-mono font-bold px-3 py-1 rounded-md border border-slate-700">
                                                    {pred.ticker}
                                                </span>
                                                <span class="text-xs text-slate-400">
                                                    {new Date(pred.timestamp).toLocaleTimeString()}
                                                </span>
                                            </div>
                                            
                                            {/* Signal Badge */}
                                            {pred.signal === 'BUY' && (
                                                <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                                                    <i data-lucide="trending-up" class="w-4 h-4"></i> BUY
                                                </span>
                                            )}
                                            {pred.signal === 'SELL' && (
                                                <span class="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                                                    <i data-lucide="trending-down" class="w-4 h-4"></i> SELL
                                                </span>
                                            )}
                                            {pred.signal === 'UNCERTAIN' && (
                                                <span class="bg-slate-500/20 text-slate-400 border border-slate-500/30 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                                                    <i data-lucide="minus" class="w-4 h-4"></i> SKIP
                                                </span>
                                            )}
                                        </div>
                                        
                                        <p class="text-slate-200 text-lg font-medium leading-relaxed mb-4">
                                            "{pred.headline}"
                                        </p>
                                        
                                        <div class="flex items-center justify-between border-t border-slate-700 pt-3">
                                            <div class="text-sm text-slate-400">AI Confidence Level</div>
                                            <div class="text-lg font-bold text-white">
                                                {pred.confidence_score}%
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons
        setTimeout(() => {
            if(window.lucide) window.lucide.createIcons();
        }, 100);
    </script>
    
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
